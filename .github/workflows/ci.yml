name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: fm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm -d fm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fm:fm@localhost:5432/fm
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run format:check

      - run: npm run lint -- --deny-warnings

      - run: npm run build

      - run: npm test

      - run: npx prisma migrate deploy

      - run: npm run test:e2e
